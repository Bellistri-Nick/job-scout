<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}jobmail{% endblock %}</title>
<style>
  :root {
    --bg:#f4f6f8; --card:#fff; --card-2:#fafbfc; --ink:#141a23; --ink-2:#3d4759;
    --muted:#6b7484; --line:#e3e7ec; --line-2:#eef1f4;
    --accent:#2f6fed; --accent-soft:#e8f0fe;
    --hi:#d92d20; --hi-soft:#fde9e7; --med:#b56a00; --med-soft:#fdf1dd;
    --lo:#0f7f4a; --lo-soft:#e4f5ec;
    --applied:#7b8496; --screening:#6f5ce8; --interviewing:#2f6fed;
    --assessment:#0a92a5; --offer:#0f7f4a; --rejected:#98a0ad;
    --withdrawn:#98a0ad; --closed:#98a0ad;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1117; --card:#151b24; --card-2:#1b222d; --ink:#e8ecf2; --ink-2:#c2cad6;
      --muted:#8b95a5; --line:#242c38; --line-2:#1e2530;
      --accent:#6a9bff; --accent-soft:#16233d;
      --hi:#ff6b5e; --hi-soft:#3a1e1c; --med:#e0a340; --med-soft:#33280f;
      --lo:#42c98a; --lo-soft:#122c20;
      --applied:#78818f; --rejected:#6d7684; --withdrawn:#6d7684; --closed:#6d7684;
      --shadow:0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  html, body { max-width:100%; overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
         -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  header { display:flex; align-items:center; gap:14px; padding:0 20px; height:56px;
           border-bottom:1px solid var(--line); background:var(--card);
           position:sticky; top:0; z-index:10; }
  header h1 { margin:0; font-size:15px; font-weight:650; letter-spacing:-.01em; }
  header h1 a { color:inherit; }
  header h1 a:hover { text-decoration:none; }
  .crumb { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:8px; min-width:0; }
  .crumb b { color:var(--ink); font-weight:600; }
  .spacer { margin-left:auto; }
  .status { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px;
            white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--lo); flex:none; }
  .dot.stale-poll { background:var(--med); }
  .dot.err { background:var(--hi); }

  main { padding:20px 20px 72px; max-width:1360px; margin:0 auto; min-width:0; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
       margin:26px 0 10px; font-weight:650; display:flex; align-items:center; gap:8px; }
  h2:first-child { margin-top:0; }
  h2 .count { color:var(--ink-2); background:var(--line-2); border-radius:999px;
              padding:1px 7px; font-size:11px; letter-spacing:0; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
          box-shadow:var(--shadow); overflow:hidden; }
  .card > table { margin:0; }
  .pad { padding:14px 16px; }

  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line-2);
           vertical-align:top; overflow-wrap:anywhere; }
  th { font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
       font-weight:650; background:var(--card-2); border-bottom:1px solid var(--line);
       white-space:nowrap; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:var(--card-2); }

  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px;
          font-weight:650; text-transform:capitalize; white-space:nowrap; }
  .u-high{background:var(--hi-soft);color:var(--hi)}
  .u-medium{background:var(--med-soft);color:var(--med)}
  .u-low{background:var(--lo-soft);color:var(--lo)}
  .pill.solid { color:#fff; }
  .s-applied{background:var(--applied);color:#fff} .s-screening{background:var(--screening);color:#fff}
  .s-interviewing{background:var(--interviewing);color:#fff} .s-assessment{background:var(--assessment);color:#fff}
  .s-offer{background:var(--offer);color:#fff} .s-rejected{background:var(--rejected);color:#fff}
  .s-withdrawn{background:var(--withdrawn);color:#fff} .s-closed{background:var(--closed);color:#fff}

  .btn { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:620;
         padding:4px 10px; border-radius:7px; border:1px solid var(--line);
         background:var(--card); color:var(--ink); white-space:nowrap; line-height:1.5; }
  .btn:hover { border-color:var(--accent); color:var(--accent); text-decoration:none; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { color:#fff; filter:brightness(1.07); }
  .btn + .btn { margin-left:6px; }
  tr[data-href] { cursor:pointer; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }

  .muted { color:var(--muted); }
  .small { font-size:12px; }
  .empty { color:var(--muted); padding:22px 16px; text-align:center; }
  .empty strong { display:block; color:var(--ink-2); font-weight:600; margin-bottom:3px; }

  .msg { border-left:3px solid var(--line); padding:10px 16px; margin:12px 0; }
  .msg.in { border-color:var(--accent); } .msg.out { border-color:var(--lo); }
  .msg .hd { display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; }
  .msg .hd .who { font-weight:600; }
  pre.body { white-space:pre-wrap; word-wrap:break-word;
             font:12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
             background:var(--card-2); border:1px solid var(--line); border-radius:8px;
             padding:12px; margin:8px 0 0; max-height:460px; overflow:auto; }
  .kv { display:grid; grid-template-columns:max-content 1fr; gap:5px 16px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
  .three { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:start; }
  @media (max-width:1100px){ .three{grid-template-columns:1fr 1fr} }
  @media (max-width:900px){ .two,.three{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <h1><a href="/">jobmail</a></h1>
  <nav class="crumb"><a href="/">pipeline</a> <span class="muted">·</span> <a href="/metrics">metrics</a></nav>
  {% block crumbs %}{% endblock %}
  <span class="spacer"></span>
  {% block meta %}{% endblock %}
</header>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
