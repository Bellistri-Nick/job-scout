[project]
name = "jobmail"
version = "0.1.0"
description = "Read-only job-search inbox agent: IMAP → Claude → SQLite → Telegram/email alerts → Obsidian + dashboard"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobmail = "jobmail.pipeline:main"
jobmail-preflight = "jobmail.preflight:main"
jobmail-backfill = "jobmail.backfill:main"
jobmail-telegram = "jobmail.telegram_setup:main"
jobmail-dashboard = "jobmail.dashboard:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobmail*"]

[tool.setuptools.package-data]
jobmail = ["templates/*.html"]
